name: Feature request
description: Sugira uma melhoria para o Lumen.
title: "[Ideia] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Para ideias abertas ou ainda não detalhadas, prefira [Discussions](https://github.com/hribeirojob/Lumen/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que situação você quer resolver?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como o Lumen poderia resolver isso?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
